name: InvoiceVision Child Windows installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/INVOICE_OCR_CHILD_R113_R4_R2_VERIFIED_UPDATE.zip'
      - 'scripts/build-windows.ps1'
      - 'scripts/package-installers.ps1'
      - 'installer/InvoiceVisionChild.iss'
      - '.github/workflows/windows-installers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/INVOICE_OCR_CHILD_R113_R4_R2_VERIFIED_UPDATE.zip'
      - 'scripts/build-windows.ps1'
      - 'scripts/package-installers.ps1'
      - 'installer/InvoiceVisionChild.iss'
      - '.github/workflows/windows-installers.yml'

permissions:
  contents: read

concurrency:
  group: invoicevision-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify source, compile, smoke-test and package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned Child archive and safely extract the verified baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'source/INVOICE_OCR_CHILD_R113_R4_R2_VERIFIED_UPDATE.zip'
          if (!(Test-Path -LiteralPath $src -PathType Leaf)) {
            throw 'Verified Child archive is not yet uploaded. No Setup.exe or Update.exe may be produced.'
          }
          $sha = (Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'ad4720d1037558e637fd42abf8e40bce34b505f6cfa73f29dcc3a67816a9ac59') {
            throw "Pinned verified source ZIP hash mismatch: $sha"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $src).Path)
          try {
            foreach ($item in $archive.Entries) {
              $name = $item.FullName.Replace('\\','/')
              if ($name.StartsWith('/') -or $name -match '(^|/)\.\.(/|$)' -or $name -match '^[A-Za-z]:') {
                throw "Unsafe ZIP member $name"
              }
            }
          } finally { $archive.Dispose() }
          Expand-Archive -LiteralPath $src -DestinationPath '.' -Force
          if (!(Test-Path 'InvoiceVisionChild/InvoiceVisionChild.csproj')) { throw 'Child project missing' }
          if (!(Test-Path 'CHILD_SOURCE_SHA256.json')) { throw 'Child file manifest missing' }
          Write-Host 'PINNED_CHILD_ARCHIVE_HASH_PASS'
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate and build genuine self-contained Child
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install Inno Setup build utility
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          Get-Command 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -ErrorAction Stop
      - name: Build Windows Setup.exe and Update.exe
        shell: pwsh
        run: ./scripts/package-installers.ps1
      - name: Upload ONLY verified executables, checksums and build report
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceVisionChild-Windows-Installers
          path: |
            release/InvoiceVisionChild_Setup.exe
            release/InvoiceVisionChild_Update.exe
            release/*.sha256.txt
            release/BUILD_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
