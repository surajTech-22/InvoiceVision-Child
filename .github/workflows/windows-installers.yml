name: InvoiceVision Child Windows installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'InvoiceVisionChild/**'
      - 'CHILD_SOURCE_SHA256.json'
      - 'installer/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'InvoiceVisionChild/**'
      - 'CHILD_SOURCE_SHA256.json'
      - 'installer/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: invoicevision-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify source, compile, smoke-test and package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate and build genuine self-contained Child
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install Inno Setup build utility
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          Get-Command 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -ErrorAction Stop
      - name: Build Windows Setup.exe and Update.exe
        shell: pwsh
        run: ./scripts/package-installers.ps1
      - name: Upload ONLY verified executables, checksums and build report
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceVisionChild-Windows-Installers
          path: |
            release/InvoiceVisionChild_Setup.exe
            release/InvoiceVisionChild_Update.exe
            release/*.sha256.txt
            release/BUILD_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
