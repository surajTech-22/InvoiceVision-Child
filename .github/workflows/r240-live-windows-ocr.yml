name: R240 full Windows Child offline CPU OCR integration (synthetic only)
on:
  push:
    branches: [research/invoicevision-r220-source-witness]
    paths:
      - 'scripts/r240_live_windows_ocr_smoke.py'
      - '.github/workflows/r240-live-windows-ocr.yml'
      - 'scripts/stage-r144-integration.py'
      - 'integration/Engine/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  child-live-analyze-and-ocr:
    runs-on: windows-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original Child archive before extraction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='source/INVOICE_OCR_CHILD_R113_R4_R2_VERIFIED_UPDATE.zip'
          $sha=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -cne 'ad4720d1037558e637fd42abf8e40bce34b505f6cfa73f29dcc3a67816a9ac59') {
            throw 'Original 73-file Child archive verification failed'
          }
          Expand-Archive -LiteralPath $src -DestinationPath integration-build -Force
      - name: Provision isolated runner image-processing libraries
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'opencv-python-headless==4.11.0.86'
          if ($LASTEXITCODE -ne 0) { throw 'Offline runtime build prerequisites unavailable' }
          python -c "import numpy,cv2;print('R240_LOCAL_OPENCV_READY',cv2.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Python cv2/numpy not ready' }
      - name: Install local Tesseract OCR for real CPU inference
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install tesseract --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Local Tesseract installation failed' }
          $exe='C:/Program Files/Tesseract-OCR/tesseract.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            $exe=(Get-Command tesseract.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $exe -or -not (Test-Path $exe -PathType Leaf)) {
            throw 'Installed Tesseract OCR binary not discoverable'
          }
          $env:TESSERACT_EXE=$exe
          & $exe --version
          & $exe --list-langs
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract traineddata unavailable' }
          "TESSERACT_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'R240_OFFLINE_NATIVE_TESSERACT_INSTALLED'
      - name: Stage genuine source-verified Child engine overlays
        shell: pwsh
        run: |
          python scripts/stage-r144-integration.py integration-build
          if ($LASTEXITCODE -ne 0) { throw 'Native Child Engine stage verification failed' }
      - name: Run real Child analyze and OCR on source-hashed synthetic invoice
        shell: pwsh
        run: |
          python scripts/r240_live_windows_ocr_smoke.py --engine integration-build/InvoiceVisionChild/Engine --out r240-live-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Child OCR did not pass synthetic proof' }
      - name: Publish ONLY synthetic JSON proof, never customer photos or OCR source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R240-Real-Windows-Offline-OCR-Synthetic-Evidence
          path: r240-live-evidence/R240_LIVE_OCR_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 7
