name: InvoiceVision R136 real-invoice independent CPU OCR comparison
on:
  push:
    branches:
      - research/invoicevision-r135-unreleased
    paths:
      - 'experiments/r136_real_invoice_cpu_ocr.py'
      - '.github/workflows/r136-real-invoice-cpu-ocr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-ocr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [rapidocr, paddleocr]
    timeout-minutes: 45
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      FLAGS_use_mkldnn: '0'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert CPU-only environment
        shell: bash
        run: |
          python -c "import platform;print(platform.platform())"
          if command -v nvidia-smi >/dev/null; then nvidia-smi; else echo NO_GPU_REQUIRED; fi
      - name: Install RapidOCR CPU
        if: matrix.engine == 'rapidocr'
        run: python -m pip install -r scripts/requirements-ocr-benchmark.txt --disable-pip-version-check
      - name: Install PaddleOCR CPU
        if: matrix.engine == 'paddleocr'
        run: |
          python -m pip install 'paddlepaddle==3.2.2' 'paddleocr==3.7.0' 'Pillow>=10,<12' 'opencv-python-headless' --disable-pip-version-check
      - name: Verify 15 real source hashes, perform inference and draw comparisons
        shell: bash
        run: |
          python experiments/r136_real_invoice_cpu_ocr.py --engine '${{ matrix.engine }}' --out "research_results/${{ matrix.engine }}"
      - name: Preserve research-only evidence including failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceVision-R136-Real-CPU-${{ matrix.engine }}
          path: research_results/${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
